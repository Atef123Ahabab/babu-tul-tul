<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Tul Tul Shona Baby</title>
    <style>
        body { background-color: #ffe6e6; font-family: 'Arial', sans-serif; text-align: center; padding-top: 100px; overflow: hidden; }
        h1 { color: #ff3366; font-size: 3rem; animation: pulse 2s infinite; }
        p { color: #333; font-size: 1.5rem; margin-top: 20px; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .heart { color: red; font-size: 5rem; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0% { transform: translateY(0); } 50% { transform: translateY(-20px); } 100% { transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="heart">❤️</div>
    <h1>I Love You, Tul Tul Shona Baby!</h1>
    <p>You are my everything. This is just a small surprise to tell you how much you mean to me.</p>
    <p>Forever yours.</p>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Tul Tul Shona Baby</title>
    <style>
        body {
            background-color: #ffe6e6;
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin: 0;
            padding: 50px 0;
            overflow: hidden;
        }
        h1 {
            color: #ff3366;
            font-size: 2.5rem;
            margin-bottom: 40px;
            animation: pulse 2s infinite;
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 100px;
            position: relative;
            max-width: 900px;
            margin: 0 auto;
        }
        .photo-frame {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            border: 8px solid #ff3366;
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.5);
            overflow: hidden;
            position: relative;
            z-index: 2;
            background-color: #fff;
        }
        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .kiss {
            position: absolute;
            color: #ff3366;
            font-size: 24px;
            z-index: 1;
            animation: flyKiss 2s linear infinite;
            opacity: 0;
        }
        @keyframes flyKiss {
            0% { transform: translate(0, 0) scale(0.5); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translate(220px, 0) scale(1.5); opacity: 0; }
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        p {
            color: #333;
            font-size: 1.2rem;
            margin-top: 40px;
            padding: 0 20px;
        }
    </style>
</head>
<body>

    <h1>I Love You, Tul Tul Shona Baby!</h1>

    <div class="container" id="kissContainer">
        <!-- Your Photo -->
        <div class="photo-frame">
            <img src="boy.jpg" alt="Me">
        </div>

        <!-- Her Photo -->
        <div class="photo-frame">
            <img src="girl.jpg" alt="Tul Tul Shona Baby">
        </div>
    </div>

    <p>You are my everything. Here are a million kisses flying your way. Forever yours. ❤️</p>

    <script>
        const container = document.getElementById('kissContainer');
        const kissSymbols = ['❤️', '💋', '💖', '😘'];

        function createKiss() {
            const kiss = document.createElement('div');
            kiss.classList.add('kiss');
            kiss.innerText = kissSymbols[Math.floor(Math.random() * kissSymbols.length)];
            
            const randomY = Math.random() * 200 - 100; 
            const randomDelay = Math.random() * 2;
            const randomDuration = 1.5 + Math.random() * 1.5;

            kiss.style.top = `calc(50% + ${randomY}px)`;
            kiss.style.left = `250px`; 
            kiss.style.animationDuration = `${randomDuration}s`;
            kiss.style.animationDelay = `${randomDelay}s`;

            container.appendChild(kiss);

            setTimeout(() => {
                kiss.remove();
            }, randomDuration * 1000);
        }

        setInterval(createKiss, 80);
    </script>
</body>
</html>
